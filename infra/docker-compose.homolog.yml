name: pyahu-scrum-homolog

# Homologação — branch: develop
# Frontend:  https://homolog.pyahuscrum.adbfn6.easypanel.host
# API:       https://api-homolog.pyahuscrum.adbfn6.easypanel.host
#
# Pré-requisito: backend/.env com GEMINI_API_KEY e GOOGLE_APPLICATION_CREDENTIALS

services:

  # ── Frontend — React SPA via nginx ──────────────────────────────────────────
  pyahuscrum-frontend-homolog:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: prod
      args:
        REACT_APP_AGENT_ORCHESTRATOR_URL: https://api-homolog.pyahuscrum.adbfn6.easypanel.host
        # Firebase real — projeto pyahu-scrum
        REACT_APP_FIREBASE_API_KEY: AIzaSyAs0bH4VYB6CayvqrMfTEZjNv9AYt99Uro
        REACT_APP_FIREBASE_AUTH_DOMAIN: pyahu-scrum.firebaseapp.com
        REACT_APP_FIREBASE_PROJECT_ID: pyahu-scrum
        REACT_APP_FIREBASE_STORAGE_BUCKET: pyahu-scrum.firebasestorage.app
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "365029905997"
        REACT_APP_FIREBASE_APP_ID: "1:365029905997:web:ae14e549e67127fc82ae04"
        REACT_APP_USE_EMULATOR: "false"
    container_name: pyahuscrum-frontend-homolog
    networks:
      - easypanel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=easypanel
      - traefik.http.routers.pyahuscrum-frontend-homolog.rule=Host(`homolog.pyahuscrum.adbfn6.easypanel.host`)
      - traefik.http.routers.pyahuscrum-frontend-homolog.entrypoints=https
      - traefik.http.routers.pyahuscrum-frontend-homolog.tls.certresolver=letsencrypt
      - traefik.http.services.pyahuscrum-frontend-homolog.loadbalancer.server.port=80
    restart: unless-stopped

  # ── Backend — FastAPI Agent Orchestrator ────────────────────────────────────
  pyahuscrum-api-homolog:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: pyahuscrum-api-homolog
    env_file:
      - ../backend/.env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@pyahuscrum-rabbitmq-homolog:5672/
      - GOOGLE_CLOUD_PROJECT=pyahu-scrum
      - START_CONSUMER=true
      - CORS_ALLOWED_ORIGINS=https://homolog.pyahuscrum.adbfn6.easypanel.host,https://pyahuscrum.adbfn6.easypanel.host,http://localhost:3000
    volumes:
      # Service account — gerado no GCP Console (NÃO commitar)
      - ../backend/pyahu-scrum-sa.json:/app/pyahu-scrum-sa.json:ro
    networks:
      - easypanel
    depends_on:
      pyahuscrum-rabbitmq-homolog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=easypanel
      - traefik.http.routers.pyahuscrum-api-homolog.rule=Host(`api-homolog.pyahuscrum.adbfn6.easypanel.host`)
      - traefik.http.routers.pyahuscrum-api-homolog.entrypoints=https
      - traefik.http.routers.pyahuscrum-api-homolog.tls.certresolver=letsencrypt
      - traefik.http.services.pyahuscrum-api-homolog.loadbalancer.server.port=8000
    restart: unless-stopped

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  pyahuscrum-rabbitmq-homolog:
    image: rabbitmq:3.13-alpine
    container_name: pyahuscrum-rabbitmq-homolog
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - easypanel
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
    volumes:
      - pyahuscrum-rabbitmq-homolog-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  pyahuscrum-rabbitmq-homolog-data:

networks:
  easypanel:
    external: true
