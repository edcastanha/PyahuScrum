name: pyahu-scrum-dev

services:
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: dev
    container_name: pyahu-scrum-frontend
    ports:
      - "5000:3000"
    volumes:
      - ../frontend/:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm start

  frontend-build:
    profiles: ["build"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: build
    container_name: pyahu-scrum-frontend-build
    volumes:
      - ../frontend/build:/app/build
    environment:
      - NODE_ENV=production
    command: npm run build

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: pyahu-scrum-backend
    ports:
      - "8001:8000"
    volumes:
      - ../backend/:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - GOOGLE_CLOUD_PROJECT=pyahu-scrum-local
    depends_on:
      rabbitmq:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pyahu-scrum-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: pyahu-scrum-firestore-emulator
    ports:
      - "8080:8080"
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 10
