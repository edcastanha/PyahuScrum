server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache dos assets buildados (hash no nome do arquivo)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
